<script>
/* ==========================================================================
   BasicGym - extra links in the About us menu, site wide
   Elementor > Custom Code, location <body> end, entire site.

   The header menu is written into each page's own HTML widget (15 pages), so
   this one snippet adds links to the About us dropdown everywhere:
     4 Nov 2026  Basic Icons, under About us
     5 Nov 2026  Online Coaching, under Personal Training
   The current page's link is highlighted. If a link is ever written into a
   page's own nav, the snippet sees it and adds nothing.
   ========================================================================== */
(function () {
  var LINKS = [
    { href: '/basic-icons/',     text: 'Basic Icons',     after: '/about-us/' },
    { href: '/online-coaching/', text: 'Online Coaching', after: '/personal-training/' }
  ];
  function addLinks() {
    var path = location.pathname.replace(/\/?$/, '/');
    document.querySelectorAll('.nav .navdrop-menu').forEach(function (menu) {
      LINKS.forEach(function (l) {
        if (menu.querySelector('a[href="' + l.href + '"]')) return;
        var a = document.createElement('a');
        a.href = l.href;
        a.textContent = l.text;
        if (path === l.href) a.setAttribute('aria-current', 'page');
        var ref = menu.querySelector('a[href="' + l.after + '"]');
        if (ref) menu.insertBefore(a, ref.nextSibling); else menu.appendChild(a);
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addLinks);
  else addLinks();
})();
</script>
