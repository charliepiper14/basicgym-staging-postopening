<script>
/* ==========================================================================
   BasicGym - extra links in the header menu and the footer, site wide
   Elementor > Custom Code, location <body> end, entire site.
   Replace the existing snippet with this one (same place, same settings).

   The header menu and footer are written into each page's own widgets
   (15+ pages), so this one snippet changes links everywhere:
     4 Nov 2026  Basic Icons, in the About us menu
     5 Nov 2026  Events, in the About us menu and the footer (More info)
     8 Nov 2026  Online Coaching, after Personal Training in the menu and footer
     9 Nov 2026  Riaz: old Personal Training link hidden. The online coaching
                 page (/online-coaching/) now shows as "Personal Training".
                 The /personal-training/ page itself is still live, only
                 taken out of the menu and footer.
     9 Nov 2026  Personal Training moved out of the About us dropdown into
                 the main header, after Membership, so it shows straight
                 away on desktop and in the mobile menu.
   The current page's link is highlighted. If a link is already on the page,
   the snippet adds nothing.
   ========================================================================== */
(function () {
  var PT = { href: '/online-coaching/', text: 'Personal Training' };
  var MENU = [
    { href: '/basic-icons/', text: 'Basic Icons', after: '/about-us/' },
    { href: '/events/',      text: 'Events',      after: '/basic-icons/' }
  ];
  var FOOTER = [
    { href: '/events/', text: 'Events', after: '/basic-icons/' },
    { href: PT.href, text: PT.text, after: '/personal-training/' }
  ];
  var MENU_HIDE = ['/personal-training/', PT.href];     /* PT sits in the main header instead */
  var FOOTER_HIDE = ['/personal-training/'];
  var path = location.pathname.replace(/\/?$/, '/');

  function link(l) {
    var a = document.createElement('a');
    a.href = l.href;
    a.textContent = l.text;
    if (path === l.href) a.setAttribute('aria-current', 'page');
    return a;
  }
  function add(box, l) {
    var a = box.querySelector('a[href="' + l.href + '"]');
    if (a) { a.textContent = l.text; return; }
    a = link(l);
    var ref = box.querySelector('a[href="' + l.after + '"]');
    if (ref) box.insertBefore(a, ref.nextSibling); else box.appendChild(a);
  }
  function hide(box, list) {
    list.forEach(function (h) {
      box.querySelectorAll('a[href="' + h + '"]').forEach(function (a) { a.remove(); });
    });
  }
  function top(links) {
    var kids = [].slice.call(links.children);
    for (var i = 0; i < kids.length; i++) if (kids[i].getAttribute('href') === PT.href) return;
    var a = link(PT);
    var drop = links.querySelector(':scope > .navdrop');
    var mem = links.querySelector(':scope > a[href="/membership/"]:not(.btn)');
    if (mem) links.insertBefore(a, mem.nextSibling);
    else if (drop) links.insertBefore(a, drop);
    else links.appendChild(a);
  }
  function fix() {
    document.querySelectorAll('.nav .links').forEach(top);
    document.querySelectorAll('.nav .navdrop-menu').forEach(function (m) {
      MENU.forEach(function (l) { add(m, l); });
      hide(m, MENU_HIDE);
    });
    document.querySelectorAll('.bg-ftr .foot-col').forEach(function (c) {
      if (!c.querySelector('a[href="/basic-icons/"]')) return;     /* the More info column */
      FOOTER.forEach(function (l) { add(c, l); });
      hide(c, FOOTER_HIDE);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix);
  else fix();
})();
</script>
